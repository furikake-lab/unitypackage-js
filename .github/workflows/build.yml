name: Build

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            examples/react-demo/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run verify:package
      - run: npm ci
        working-directory: examples/react-demo
      - run: npm run build
        working-directory: examples/react-demo
